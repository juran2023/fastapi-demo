[project]
name = "fastapi-demo"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.14"
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "playground.*"
ignore_errors = true